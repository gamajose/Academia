<!doctype html>
<html lang="pt-BR">
<head>
  <script src="./ui-bootstrap.js?v=20260718-1"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pré-matrículas - BlueREC Academia</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./theme-modern.css" />
  <link rel="stylesheet" href="./product-layout.css" />
  <link rel="stylesheet" href="./pre-enrollments.css?v=20261006-2" />
</head>
<body>
  <main class="app-shell">
    <section class="panel pre-enrollment-panel" id="received-signups-panel">
      <div class="toolbar pre-enrollment-toolbar">
        <h2 class="page-section-title">Pré-matrículas</h2>
        <div class="toolbar-actions compact-toolbar-actions">
          <button id="open-check-code-btn" class="button primary" type="button">Validar código</button>
          <button class="icon-button" id="signup-search-toggle" type="button" aria-label="Pesquisar solicitações" title="Pesquisar solicitações"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></button>
        </div>
      </div>
      <div class="signup-search-wrap hidden"><input id="signup-search" placeholder="Buscar por nome, plano, status ou código" /></div>
      <p class="status-line" id="signup-status"></p>
      <ul id="signup-list"></ul>
      <div class="signup-pagination" id="signup-pagination"></div>
    </section>
  </main>

  <div class="modal hidden" id="check-code-modal" role="dialog" aria-modal="true" aria-labelledby="check-code-title">
    <div class="modal-card" style="max-width: 440px;">
      <div class="modal-header">
        <h3 id="check-code-title" style="margin: 0; font-size: 18px;">Validar código</h3>
        <button class="secondary modal-close" id="close-check-code-modal" type="button" aria-label="Fechar" title="Fechar">×</button>
      </div>
      <div style="display: grid; gap: 12px; margin-top: 14px;">
        <input id="check-code" placeholder="Código apresentado pelo aluno" style="font-size: 15px;" />
        <button id="check-code-button" class="button primary">Verificar</button>
        <p class="status-line" id="check-code-status" style="margin: 0; min-height: 24px;"></p>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="qr-modal">
    <div class="modal-card" style="text-align:center; max-width:520px;">
      <div class="toolbar">
        <h3>Cartão de liberação</h3>
        <button class="secondary modal-close" id="close-qr-modal" aria-label="Fechar" title="Fechar">×</button>
      </div>
      <p id="qr-name" class="status-line"></p>
      <img id="qr-image" alt="QR Code da pré-matrícula" style="width:220px;height:220px;margin:16px auto;display:block;background:#fff;padding:12px;border-radius:16px;" />
      <h2 id="qr-code"></h2>
      <p class="status-line">Apresente este código ou QR Code na recepção da academia.</p>
    </div>
  </div>

  <script src="./guard.js"></script>
  <script src="./nav.js?v=20260719-1"></script>
  <script src="./solicitacoes.js"></script>
</body>
</html>

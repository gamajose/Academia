<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acessar conta - BlueREC Academia</title>
  <link rel="stylesheet" href="./landing.css?v=20261005-4" />
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <div class="site-brand-wrap">
        <a class="brand" href="./index.html"><span>Blue</span>REC</a>
        <a class="nav-instagram" href="https://www.instagram.com/academiablue.rec/" target="_blank" rel="noreferrer" aria-label="Instagram da Academia" title="Instagram">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </a>
      </div>
      <nav class="site-nav">
        <a href="./index.html">Início</a>
        <a href="./plans.html">Planos</a>
      </nav>
    </header>

    <section class="login-layout login-centered-layout">
      <form class="login-card-premium site-login-card" id="login-form" aria-labelledby="login-title" novalidate>
        <h2 id="login-title" style="margin-top:0;margin-bottom:18px;font-size:24px;">Acessar conta</h2>

        <div class="form-field">
          <label for="student-email">E-mail ou telefone</label>
          <input id="student-email" type="text" autocomplete="username" placeholder="E-mail ou telefone" required />
        </div>
        <div class="form-field">
          <label for="student-password">Senha</label>
          <div class="password-field-wrapper">
            <input id="student-password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />
            <button class="password-toggle-eye" id="password-toggle" type="button" aria-label="Mostrar senha" title="Mostrar senha">
              <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <label class="remember-row"><input id="remember-account" type="checkbox" /> <span>Manter conectado neste dispositivo</span></label>

        <button class="cta login-primary" id="student-login-button" type="submit">Entrar</button>
        <div class="auth-divider"><span>ou continue com</span></div>
        <div id="google-login-button" class="google-login-button"></div>
        <div class="login-secondary-actions">
          <a class="cta ghost" href="./student-register.html">Criar uma conta nova</a>
          <button class="cta ghost" id="forgot-password-button" type="button">Esqueci a senha</button>
        </div>
        <small class="login-message" id="student-login-message" aria-live="polite"></small>
      </form>
    </section>
  </main>
  <div class="enrollment-modal hidden" id="forgot-modal" role="dialog" aria-modal="true" aria-labelledby="forgot-title">
    <form class="enrollment-card recovery-card" id="forgot-form" novalidate>
      <div class="modal-header"><div><p class="eyebrow-public">Recuperar acesso</p><h2 id="forgot-title">Vamos devolver seu acesso</h2><p>Informe o e-mail usado na academia e enviaremos as instruções.</p></div><button class="modal-close" id="close-forgot" type="button" aria-label="Fechar" title="Fechar">×</button></div>
      <div class="form-field"><label for="forgot-email">E-mail ou telefone</label><input id="forgot-email" type="text" autocomplete="username" placeholder="E-mail ou telefone" required /></div>
      <p class="enrollment-message" id="forgot-message" aria-live="polite"></p>
      <div class="form-actions"><button class="cta ghost" id="cancel-forgot" type="button">Cancelar</button><button class="cta" id="submit-forgot" type="submit">Enviar instruções</button></div>
    </form>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./student-login.js?v=20261005-4"></script>
</body>
</html>
